server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/wazuh-health;
    index index.html;

    access_log off;
    error_log /var/log/nginx/wazuh-health-error.log warn;

    location = /health.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
